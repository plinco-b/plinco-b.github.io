<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FIG calls — breakeven by strike</title>
<style>
  :root {
    color-scheme: light;
    --page:    #f9f9f7;
    --surface: #fcfcfb;
    --ink:     #0b0b0b;
    --ink-2:   #52514e;
    --muted:   #898781;
    --grid:    #e1e0d9;
    --axis:    #c3c2b7;
    --hair:    rgba(11,11,11,.10);
    --spot:    #eb6834;
    --warn:    #ec835a;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --hair: rgba(255,255,255,.10); --spot: #d95926; --warn: #ec835a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --hair: rgba(255,255,255,.10); --spot: #d95926; --warn: #ec835a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 64px;
    background: var(--page); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  h1 { font-size: 21px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }

  .meta {
    display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 26px;
  }
  .pill {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 8px;
    padding: 8px 13px; font-size: 13px; color: var(--ink-2);
  }
  .pill b { color: var(--ink); font-weight: 600; }

  .card {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 12px;
    padding: 18px 18px 10px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .card .note { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  .chart-scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 620px; height: auto; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  details { margin: 4px 0 8px; }
  summary {
    cursor: pointer; color: var(--ink-2); font-size: 13px;
    padding: 6px 0; user-select: none;
  }
  summary:hover { color: var(--ink); }
  .tbl-scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 11px 5px 0; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--grid); }
  td { color: var(--ink-2); }

  .tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .09s;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 9px;
    padding: 9px 11px; font-size: 12.5px; font-variant-numeric: tabular-nums;
    box-shadow: 0 6px 22px rgba(0,0,0,.16); z-index: 10; min-width: 150px;
  }
  .tip .d { color: var(--muted); margin-bottom: 5px; font-size: 11.5px; }
  .tip .r { display: flex; align-items: center; gap: 7px; line-height: 1.5; }
  .tip .r i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .tip .r span { color: var(--ink-2); }
  .tip .r b { margin-left: auto; color: var(--ink); font-weight: 600; }
  .tip .r b em { color: var(--muted); font-weight: 400; font-style: normal; margin-left: 5px; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 10px 16px; margin: 0 0 22px;
  }
  .chk {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none;
  }
  .chk:hover { color: var(--ink); }
  .chk input { accent-color: var(--spot); width: 14px; height: 14px; cursor: pointer; }

  .seg {
    display: inline-flex; background: var(--surface); border: 1px solid var(--hair);
    border-radius: 9px; padding: 3px; gap: 3px;
  }
  .seg button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--ink-2);
    padding: 6px 13px; border-radius: 6px; transition: background .12s, color .12s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--grid); color: var(--ink); font-weight: 600; }

  .caveat {
    border-left: 2px solid var(--warn); padding: 2px 0 2px 13px;
    color: var(--ink-2); font-size: 13.5px; margin: 22px 0 0;
  }
  .caveat b { color: var(--ink); font-weight: 600; }
  .caveat ul { margin: 7px 0 0; padding-left: 17px; }
  .caveat li { margin: 3px 0; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 26px; }
  .empty { color: var(--ink-2); font-size: 14px; padding: 10px 0 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FIG calls — breakeven by strike</h1>
  <p class="sub">What FIG has to reach by expiry for the call to break even — the strike plus what
    the call costs. Each point is one day's close; the orange diamond is FIG itself.</p>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <div class="seg" id="metric" role="group" aria-label="Price basis">
      <button data-m="mid" class="on">Bid/ask mid</button>
      <button data-m="last">Last trade</button>
    </div>
    <label class="chk"><input type="checkbox" id="bars" checked> Show bid/ask range</label>
  </div>
  <div id="charts"><p class="empty">Loading…</p></div>
  <div id="caveat"></div>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip"></div>

<script>
// Blue ordinal ramp: light->dark with strike on a light surface, and the
// mirror on dark (nearest-the-surface step = lowest strike, both modes).
// The ramp carries ORDER only -- a single hue fits ~8 visibly separate steps
// and there are 10 strikes -- so every line is labelled at its right end.
const RAMP_LIGHT = ["#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6",
                    "#256abf","#1c5cab","#184f95","#104281","#0d366b"];
const RAMP_DARK  = ["#184f95","#1c5cab","#256abf","#2a78d6","#3987e5",
                    "#5598e7","#6da7ec","#86b6ef","#9ec5f4","#b7d3f6"];

const isDark = () => {
  const t = document.documentElement.dataset.theme;
  if (t) return t === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
};
const ramp = () => isDark() ? RAMP_DARK : RAMP_LIGHT;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const money = v => "$" + v.toFixed(2);
const fmtStrike = s => (s % 1 ? s.toFixed(1) : s.toFixed(0));
const fmtDay = iso => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d))
    .toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
};

function parseCSV(text) {
  const [head, ...lines] = text.trim().split("\n");
  const cols = head.split(",");
  return lines.filter(Boolean).map(line => {
    const cells = line.split(",");
    const row = {};
    cols.forEach((c, i) => {
      const raw = cells[i];
      row[c] = (c === "date" || c === "expiration") ? raw : parseFloat(raw);
    });
    return row;
  });
}

// Space labels >= gap apart, preserving order, each cluster centred on its own
// mean so a crowded group spreads both ways instead of marching one direction.
function declutter(ys, gap) {
  const order = ys.map((y, i) => i).sort((a, b) => ys[a] - ys[b]);
  const pos = order.map(i => ys[i]);
  for (let guard = 0; guard < 200; guard++) {
    let moved = false;
    for (let i = 0; i < pos.length - 1; ) {
      if (pos[i + 1] - pos[i] < gap - 1e-9) {
        let j = i;
        while (j < pos.length - 1 && pos[j + 1] - pos[j] < gap - 1e-9) j++;
        const run = pos.slice(i, j + 1);
        const start = run.reduce((a, b) => a + b, 0) / run.length - gap * (run.length - 1) / 2;
        for (let k = 0; k < run.length; k++) pos[i + k] = start + k * gap;
        moved = true; i = j + 1;
      } else i++;
    }
    if (!moved) break;
  }
  const out = new Array(ys.length);
  order.forEach((idx, slot) => { out[idx] = pos[slot]; });
  return out;
}

function niceTicks(lo, hi, count) {
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const ticks = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) ticks.push(+t.toFixed(6));
  // Label with enough precision to be true: a 2.5 step rounded to whole dollars
  // prints gridlines at 22.5/27.5 as "$23"/"$28", misstating the scale by 50c.
  const decimals = Number.isInteger(step) ? 0 : Number.isInteger(step * 10) ? 1 : 2;
  return { ticks, label: t => "$" + t.toFixed(decimals) };
}

const W = 960, H = 500, M = { t: 16, r: 116, b: 40, l: 58 };

// On "last", a strike that has never printed carries lastPrice 0 -- that is an
// absence, not a $0 option, so it becomes a gap rather than a point on the floor.
function valueOf(r, metric) {
  if (!r) return null;
  if (metric === "last") return r.last > 0 ? r.breakeven_last : null;
  return r.breakeven;
}

function renderChart(exp, rows, metric, axisDates, spotAt, showBars) {
  // The axis spans every trading day we have a close for, not just the days
  // with option quotes -- Yahoo serves the chain live only, so a day the
  // collector missed has a stock price but no strikes. Those become gaps in
  // the strike lines rather than a silently compressed axis.
  const dates = axisDates;
  const strikes = [...new Set(rows.map(r => r.strike))].sort((a, b) => a - b);
  const colors = ramp();

  const byKey = new Map(rows.map(r => [r.date + "|" + r.strike, r]));

  const series = strikes.map((s, i) => ({
    key: fmtStrike(s), color: colors[i % colors.length],
    pts: dates.map(d => valueOf(byKey.get(d + "|" + s), metric)),
    // The whole quoted range for that strike: you can only buy at the ask and
    // only sell at the bid, so breakeven genuinely lies anywhere in here. Same
    // band in both modes -- under "last" it shows whether the print is even
    // inside the current market.
    band: dates.map(d => {
      const r = byKey.get(d + "|" + s);
      return r && r.ask > 0 ? { lo: r.strike + r.bid, hi: r.strike + r.ask } : null;
    }),
    // Marks a print carried over from an earlier session: drawn hollow so a
    // two-day-old trade can't read as that day's close.
    stale: dates.map(d => {
      const r = byKey.get(d + "|" + s);
      return metric === "last" && r ? r.last_age_days > 0 : false;
    })
  }));
  const spotSeries = {
    key: "FIG close", color: cssVar("--spot"), dashed: true, isSpot: true,
    pts: dates.map(d => spotAt.get(d) ?? null)
  };
  const all = [...series, spotSeries];

  // The scale has to cover the bars too, or a wide quote gets silently clipped
  // and the chart understates exactly the uncertainty it is meant to show.
  const vals = all.flatMap(s => s.pts).filter(v => v != null).concat(
    showBars ? series.flatMap(s => s.band).filter(Boolean).flatMap(b => [b.lo, b.hi]) : []
  );
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padY = (hi - lo || 1) * 0.10;
  lo -= padY; hi += padY;

  const iw = W - M.l - M.r, ih = H - M.t - M.b;
  // Discrete trading days: equal spacing, so weekends leave no false gap.
  const X = i => dates.length === 1 ? M.l + iw / 2 : M.l + (i / (dates.length - 1)) * iw;
  const Y = v => M.t + ih - ((v - lo) / (hi - lo)) * ih;

  const { ticks, label: tickLabel } = niceTicks(lo, hi, 6);
  const grid = cssVar("--grid"), axis = cssVar("--axis"), muted = cssVar("--muted");

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Breakeven by strike for FIG calls expiring ${exp}">`;
  ticks.forEach(t => {
    svg += `<line x1="${M.l}" x2="${M.l + iw}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="${grid}" stroke-width="1"/>`;
    svg += `<text x="${M.l - 10}" y="${(Y(t) + 4).toFixed(1)}" fill="${muted}" font-size="12" text-anchor="end">${tickLabel(t)}</text>`;
  });
  svg += `<line x1="${M.l}" x2="${M.l}" y1="${M.t}" y2="${M.t + ih}" stroke="${axis}" stroke-width="1"/>`;
  svg += `<line x1="${M.l}" x2="${M.l + iw}" y1="${M.t + ih}" y2="${M.t + ih}" stroke="${axis}" stroke-width="1"/>`;

  const stride = Math.max(1, Math.ceil(dates.length / 9));
  dates.forEach((d, i) => {
    if (i % stride && i !== dates.length - 1) return;
    svg += `<text x="${X(i).toFixed(1)}" y="${H - M.b + 20}" fill="${muted}" font-size="12" text-anchor="middle">${fmtDay(d)}</text>`;
  });

  // Bid/ask range, drawn behind everything. Deliberately not dodged apart: the
  // liquid strikes render as tight ticks while the dead ones smear into an
  // overlapping haze, and that contrast is the honest reading of the data.
  if (showBars) {
    series.forEach(s => {
      s.band.forEach((b, i) => {
        if (!b || s.pts[i] == null) return;
        const x = X(i), yl = Y(b.lo), yh = Y(b.hi);
        if (Math.abs(yl - yh) < 1.2) return;   // spread too tight to draw
        svg += `<g stroke="${s.color}" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round">`
             + `<line x1="${x.toFixed(1)}" y1="${yh.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yl.toFixed(1)}"/>`
             + `<line x1="${(x - 3.5).toFixed(1)}" y1="${yh.toFixed(1)}" x2="${(x + 3.5).toFixed(1)}" y2="${yh.toFixed(1)}"/>`
             + `<line x1="${(x - 3.5).toFixed(1)}" y1="${yl.toFixed(1)}" x2="${(x + 3.5).toFixed(1)}" y2="${yl.toFixed(1)}"/>`
             + `</g>`;
      });
    });
  }

  all.forEach(s => {
    // Join consecutive observations pair by pair. A pair that skips days we
    // never observed is drawn faint and dotted: the trend stays readable
    // without asserting a path through days that were never collected.
    const seen = s.pts.map((v, i) => (v == null ? -1 : i)).filter(i => i >= 0);
    for (let k = 1; k < seen.length; k++) {
      const a = seen[k - 1], b = seen[k];
      const bridged = b - a > 1;
      const style = s.dashed ? ' stroke-dasharray="6 3"'
                  : bridged  ? ' stroke-dasharray="1 5" stroke-opacity="0.5"'
                  : "";
      svg += `<line x1="${X(a).toFixed(1)}" y1="${Y(s.pts[a]).toFixed(1)}" `
           + `x2="${X(b).toFixed(1)}" y2="${Y(s.pts[b]).toFixed(1)}" `
           + `stroke="${s.color}" stroke-width="2" stroke-linecap="round"${style}/>`;
    }
    s.pts.forEach((v, i) => {
      if (v == null) return;
      const x = X(i), y = Y(v);
      if (s.isSpot) {
        // The stock is the reference the whole chart hangs off, and its value
        // lands inside the deep-ITM cluster by construction (their breakeven is
        // spot plus a little time value). A bigger diamond keeps it findable
        // there, and the shape distinguishes it even where marks overlap.
        const d = 5.6;
        svg += `<path d="M${x.toFixed(1)},${(y - d).toFixed(1)} L${(x + d).toFixed(1)},${y.toFixed(1)} `
             + `L${x.toFixed(1)},${(y + d).toFixed(1)} L${(x - d).toFixed(1)},${y.toFixed(1)} Z" `
             + `fill="${s.color}" stroke="${cssVar("--surface")}" stroke-width="2"/>`;
      } else {
        const stale = s.stale && s.stale[i];
        svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${stale ? 3.8 : 3.4}"`
             + ` fill="${stale ? cssVar("--surface") : s.color}" stroke="${stale ? s.color : cssVar("--surface")}"`
             + ` stroke-width="${stale ? 2 : 1.5}"/>`;
      }
    });
  });

  // Direct end-labels carry identity (see ramp note).
  const lastIdx = i => { for (let k = i.length - 1; k >= 0; k--) if (i[k] != null) return k; return -1; };
  const ends = all.map(s => { const k = lastIdx(s.pts); return { y: Y(s.pts[k]), s }; })
                  .filter(e => Number.isFinite(e.y));
  const placed = declutter(ends.map(e => e.y), 15);
  ends.forEach((e, i) => {
    svg += `<text x="${M.l + iw + 9}" y="${(placed[i] + 4).toFixed(1)}" fill="${e.s.color}" font-size="12.5" font-weight="600">${e.s.key}</text>`;
  });

  svg += `<rect class="hit" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg += `<line class="cross" x1="0" x2="0" y1="${M.t}" y2="${M.t + ih}" stroke="${axis}" stroke-width="1" opacity="0"/>`;
  svg += `</svg>`;

  return { svg, dates, all, X, geom: { iw, ih } };
}

function tableFor(rows, dates, strikes, metric) {
  let h = `<div class="tbl-scroll"><table><thead><tr><th>Date</th><th>FIG</th>`;
  strikes.forEach(s => { h += `<th>${fmtStrike(s)}</th>`; });
  h += `</tr></thead><tbody>`;
  const byKey = new Map(rows.map(r => [r.date + "|" + r.strike, r]));
  const spotAt = new Map(rows.map(r => [r.date, r.spot_close]));
  dates.forEach(d => {
    h += `<tr><td>${d}</td><td>${money(spotAt.get(d))}</td>`;
    strikes.forEach(s => {
      const r = byKey.get(d + "|" + s);
      const v = valueOf(r, metric);
      const stale = metric === "last" && r && r.last_age_days > 0;
      h += `<td>${v == null ? "—" : money(v) + (stale ? ` <span style="color:var(--muted)">(${r.last_age_days}d old)</span>` : "")}</td>`;
    });
    h += `</tr>`;
  });
  return h + `</tbody></table></div>`;
}

function wireHover(card, ctx) {
  const svg = card.querySelector("svg");
  const cross = svg.querySelector(".cross");
  const tip = document.getElementById("tip");
  const { dates, all, X } = ctx;

  const move = ev => {
    const box = svg.getBoundingClientRect();
    const sx = (ev.clientX - box.left) * (W / box.width);
    let best = 0, bd = Infinity;
    dates.forEach((_, i) => { const d = Math.abs(X(i) - sx); if (d < bd) { bd = d; best = i; } });

    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best));
    cross.setAttribute("opacity", "1");

    let html = `<div class="d">${dates[best]}</div>`;
    [...all].reverse().forEach(s => {
      const v = s.pts[best];
      if (v == null) return;
      const b = s.band && s.band[best];
      const err = b ? (b.hi - b.lo) / 2 : 0;
      html += `<div class="r"><i style="background:${s.color}"></i><span>${s.key}</span>`
            + `<b>${money(v)}${err > 0.005 ? `<em>±${err.toFixed(2)}</em>` : ""}</b></div>`;
    });
    tip.innerHTML = html;
    tip.style.opacity = "1";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = ev.clientX + 16, top = ev.clientY - th / 2;
    if (left + tw > innerWidth - 8) left = ev.clientX - tw - 16;
    tip.style.left = Math.max(8, left) + "px";
    tip.style.top = Math.min(Math.max(8, top), innerHeight - th - 8) + "px";
  };

  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", () => {
    cross.setAttribute("opacity", "0");
    tip.style.opacity = "0";
  });
}

async function main() {
  const grab = async name => {
    const res = await fetch(name, { cache: "no-store" });
    if (!res.ok) throw new Error(`${name}: ${res.status}`);
    return parseCSV(await res.text());
  };

  let rows, spotRows;
  try {
    [rows, spotRows] = await Promise.all([grab("chain.csv"), grab("spot.csv")]);
  } catch (e) {
    document.getElementById("charts").innerHTML =
      `<p class="empty">Couldn't load the data (${e.message}).</p>`;
    return;
  }
  if (!rows.length) {
    document.getElementById("charts").innerHTML = `<p class="empty">No data collected yet.</p>`;
    return;
  }

  const dates = [...new Set(rows.map(r => r.date))].sort();
  const last = dates[dates.length - 1];

  // The stock's history is retrievable retroactively, so the reference line
  // covers every trading day since tracking began -- including days the
  // collector missed, which show as gaps in the strike lines.
  const spotAt = new Map(spotRows.map(r => [r.date, r.close]));
  const axisDates = spotRows.map(r => r.date).filter(d => d >= dates[0]).sort();
  const lastClose = axisDates[axisDates.length - 1];
  const spot = spotAt.get(lastClose);
  const gaps = axisDates.filter(d => !dates.includes(d));

  document.getElementById("meta").innerHTML =
    `<div class="pill">FIG close <b>${money(spot)}</b></div>` +
    `<div class="pill">as of <b>${lastClose}</b></div>` +
    `<div class="pill"><b>${dates.length}</b> day${dates.length === 1 ? "" : "s"} of quotes` +
    `${gaps.length ? ` · <b style="color:var(--warn)">${gaps.length} missed</b>` : ""}</div>` +
    `<div class="pill">updates after each US close</div>`;

  const exps = [...new Set(rows.map(r => r.expiration))].sort();
  const host = document.getElementById("charts");

  function render(metric) {
    const showBars = document.getElementById("bars").checked;
    host.innerHTML = "";
    exps.forEach(exp => {
      const block = rows.filter(r => r.expiration === exp);
      const bDates = [...new Set(block.map(r => r.date))].sort();
      const bStrikes = [...new Set(block.map(r => r.strike))].sort((a, b) => a - b);

      const card = document.createElement("section");
      card.className = "card";
      const ctx = renderChart(exp, block, metric, axisDates, spotAt, showBars);
      card.innerHTML =
        `<h2>Expiring ${exp}</h2>` +
        `<p class="note">${bStrikes.length} strikes · ${bDates.length} day${bDates.length === 1 ? "" : "s"} of quotes` +
        `${bDates.length === 1 ? " · one close so far, so each strike is a single point" : ""}` +
        `${showBars ? " · whisker spans strike+bid to strike+ask" : ""}` +
        `${gaps.length ? " · dotted span = days with no quotes" : ""}` +
        `${metric === "last" ? " · hollow marker = the last trade is older than that day" : ""}</p>` +
        `<div class="chart-scroll">${ctx.svg}</div>` +
        `<details><summary>Show the numbers</summary>${tableFor(block, bDates, bStrikes, metric)}</details>`;
      host.appendChild(card);
      wireHover(card, ctx);
    });
    renderCaveat(metric);
  }

  function renderCaveat(metric) {
    const today = rows.filter(r => r.date === last);
    let html = "";

    if (metric === "mid") {
      // breakeven = strike + mid, so half the spread is the error bar per point.
      const wide = today.map(r => ({ ...r, err: r.spread / 2 }))
        .filter(r => r.err > 0.5).sort((a, b) => b.err - a.err);
      if (wide.length) {
        html = `<div class="caveat"><b>The whiskers are the bid/ask spread.</b> ` +
          `You can only buy at the ask and only sell at the bid, so breakeven genuinely lies ` +
          `anywhere in that range — mid is the midpoint of two quotes, not a record of a sale. ` +
          `Widest on ${last}:` +
          `<ul>${wide.map(r =>
            `<li>strike ${fmtStrike(r.strike)} — ${money(r.breakeven)} ± ${r.err.toFixed(2)} ` +
            `(bid ${r.bid.toFixed(2)} / ask ${r.ask.toFixed(2)}, open interest ${r.open_interest.toLocaleString()})</li>`
          ).join("")}</ul></div>`;
      }
    } else {
      const stale = today.filter(r => r.last > 0 && r.last_age_days > 0)
        .sort((a, b) => b.last_age_days - a.last_age_days);
      const outside = today.filter(r => r.last > 0 && (r.last > r.ask || r.last < r.bid));
      html = `<div class="caveat"><b>Last trade is a real sale — when there was one.</b> ` +
        `On the liquid strikes the last print lands seconds before the bell, so it is a genuine close. ` +
        `On thin strikes it can be days old and sit outside the current quote.`;
      if (stale.length) {
        html += `<ul>${stale.map(r =>
          `<li>strike ${fmtStrike(r.strike)} — last traded ${r.last_age_days} day${r.last_age_days === 1 ? "" : "s"} ` +
          `before ${last}, at ${money(r.last)}` +
          `${outside.includes(r) ? ` — <b>outside</b> the ${r.bid.toFixed(2)}/${r.ask.toFixed(2)} quote` : ""}</li>`
        ).join("")}</ul>`;
      }
      html += `</div>`;
    }
    document.getElementById("caveat").innerHTML = html;
  }

  const seg = document.getElementById("metric");
  const current = () => seg.querySelector("button.on").dataset.m;

  seg.addEventListener("click", ev => {
    const btn = ev.target.closest("button[data-m]");
    if (!btn) return;
    [...seg.children].forEach(b => b.classList.toggle("on", b === btn));
    render(btn.dataset.m);
  });
  document.getElementById("bars").addEventListener("change", () => render(current()));

  render("mid");

  document.getElementById("foot").innerHTML =
    (gaps.length
      ? `<b>${gaps.join(", ")}</b> have a FIG close but no option quotes — the collector `
        + `didn't run those days and Yahoo serves the chain live only, so those strikes `
        + `can't be recovered after the fact. The stock line is complete regardless.<br><br>`
      : "")
    + "Quotes from Yahoo Finance via yfinance, snapshotted after each US close. "
    + "Not thinkorswim's own book, and neither basis is an OCC settlement price. "
    + "Nov and Dec 2026 appear automatically if the exchange lists them.";
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => location.reload());
main();
</script>
</body>
</html>
